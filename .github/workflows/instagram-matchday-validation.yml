name: Validate Instagram Matchday Context

on:
  push:
    branches: [main]
    paths:
      - 'scripts/instagram_matchday.py'
      - 'scripts/instagram_engagement.py'
      - 'tests/test_instagram_matchday.py'
      - 'tests/test_instagram_engagement.py'
      - '.github/workflows/instagram-matchday-validation.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow requests
      - run: python -m unittest tests/test_instagram_daily.py tests/test_instagram_clusters.py tests/test_instagram_engagement.py tests/test_instagram_matchday.py
      - run: python -m py_compile scripts/instagram_daily.py scripts/instagram_engagement.py scripts/instagram_matchday.py
