name: Publish memes for confirmed round blocks
on:
  push:
    branches: [main]
    paths:
      - 'assets/instagram/memes-blocks/**/publish.json'
      - 'scripts/instagram_memes.py'
      - '.github/workflows/instagram-memes-blocks.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: instagram-memes-blocks
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Felandim/Felandim.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: pip install pillow
      - name: Test publication safety
        run: python -m unittest discover -s tests -p test_instagram_memes.py -v
      - name: Configure durable receipts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify actual account and source summaries
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python scripts/instagram_memes.py
      - name: Publish reviewed three-image manifests and persist receipts
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python scripts/instagram_memes.py --publish
