name: Publish Instagram Round Blocks

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/instagram-daily.yml'
      - 'scripts/instagram_*.py'
      - 'tests/test_instagram*.py'
  schedule:
    # 10:00 em São Paulo (UTC-3): publica blocos encerrados na véspera, com intervalo máximo de 48h.
    - cron: '0 13 * * *'
  workflow_dispatch:

concurrency:
  group: instagram-round-blocks
  cancel-in-progress: false

permissions:
  contents: write

env:
  INSTAGRAM_IG_USER_ID: '17841429981371844'
  INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
  INSTAGRAM_API_VERSION: 'v23.0'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pillow requests

      - name: Test Instagram automation
        run: python -m unittest discover -s tests -p 'test_instagram*.py'

      - name: Select closed round blocks
        if: github.event_name != 'push'
        id: should_post
        run: python scripts/instagram_schedule.py select

      - name: Persist pending publication queue
        if: github.event_name != 'push'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/instagram_blocks_pending.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(instagram): persist pending publication queue"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Validate Instagram token
        if: github.event_name != 'push' && steps.should_post.outputs.publish == 'true'
        id: token_check
        continue-on-error: true
        run: python scripts/instagram_token_check.py

      - name: Explain block skip
        if: github.event_name != 'push' && steps.should_post.outputs.publish != 'true'
        run: echo "No unposted round block closed yesterday; Instagram publishing was skipped."

      - name: Render round block cards
        if: steps.should_post.outputs.publish == 'true' && steps.token_check.outcome == 'success'
        run: python scripts/instagram_schedule.py render

      - name: Commit round block cards
        id: card_commit
        if: steps.should_post.outputs.publish == 'true' && steps.token_check.outcome == 'success'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add assets/instagram/blocks/
          if ! git diff --cached --quiet; then
            git commit -m "chore(instagram): render closed round blocks"
            git pull --rebase origin main
            git push origin main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish to Instagram
        id: publish
        if: steps.should_post.outputs.publish == 'true' && steps.token_check.outcome == 'success'
        continue-on-error: true
        env:
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.card_commit.outputs.sha }}/assets/instagram/blocks
        run: |
          # A resposta bruta da API pode conter detalhes sensíveis. Ela fica apenas no runner efêmero.
          python scripts/instagram_schedule.py publish --image-base-url "$IMAGE_BASE_URL" > /tmp/instagram-publish.log 2>&1

      - name: Explain missing token
        if: steps.should_post.outputs.publish == 'true' && env.INSTAGRAM_ACCESS_TOKEN == ''
        run: echo "INSTAGRAM_ACCESS_TOKEN is not configured; the pending block was preserved for retry."

      - name: Record sanitized publish status
        if: always() && steps.should_post.outputs.publish == 'true'
        env:
          TOKEN_OUTCOME: ${{ steps.token_check.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          token_outcome = os.environ.get('TOKEN_OUTCOME', 'skipped')
          publish_outcome = os.environ.get('PUBLISH_OUTCOME', 'skipped')
          if token_outcome == 'failure':
              outcome = 'credential_failure'
          else:
              outcome = publish_outcome
          payload = {
              'timestamp_utc': datetime.now(timezone.utc).isoformat(),
              'outcome': outcome,
          }
          if outcome == 'credential_failure':
              payload['detail'] = 'Credencial do Instagram inválida, expirada ou sem permissão; publicação pendente até atualizar o secret.'
          elif outcome == 'failure':
              payload['detail'] = 'Falha de publicação; resposta bruta da API suprimida por segurança.'
          path = Path('data/instagram_publish_status.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/instagram_publish_status.json
          if [ -f data/instagram_blocks_published.json ]; then
            git add data/instagram_blocks_published.json
          fi
          if [ -f data/instagram_blocks_pending.json ]; then
            git add data/instagram_blocks_pending.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(instagram): record sanitized publish status"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Fail if Instagram delivery is blocked
        if: steps.token_check.outcome == 'failure' || steps.publish.outcome == 'failure'
        run: |
          echo "::error::Instagram delivery is blocked. Review the sanitized status and update the credential when outcome is credential_failure."
          exit 1

