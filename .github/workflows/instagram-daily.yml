name: Publish Instagram Round Blocks

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/instagram-daily.yml'
      - 'scripts/instagram_*.py'
      - 'tests/test_instagram*.py'
  schedule:
    # 10:00 em São Paulo (UTC-3): publica blocos encerrados na véspera, com intervalo máximo de 48h.
    - cron: '0 13 * * *'
  workflow_dispatch:

concurrency:
  group: instagram-round-blocks
  cancel-in-progress: false

permissions:
  contents: write

env:
  INSTAGRAM_IG_USER_ID: '17841429981371844'
  INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
  INSTAGRAM_API_VERSION: 'v23.0'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pillow requests

      - name: Test Instagram automation
        run: python -m unittest discover -s tests -p 'test_instagram*.py'

      - name: Select closed round blocks
        if: github.event_name != 'push'
        id: should_post
        run: python scripts/instagram_schedule.py select

      - name: Validate Instagram token
        if: github.event_name != 'push' && steps.should_post.outputs.publish == 'true'
        run: |
          python - <<'PY'
          import os
          import requests
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          ig_user_id = os.environ['INSTAGRAM_IG_USER_ID']
          token = os.environ['INSTAGRAM_ACCESS_TOKEN']
          api_version = os.environ['INSTAGRAM_API_VERSION']
          if not token:
              raise SystemExit('INSTAGRAM_ACCESS_TOKEN is not configured.')

          retry = Retry(
              total=4,
              connect=3,
              read=3,
              backoff_factor=2,
              status_forcelist=(429, 500, 502, 503, 504),
              allowed_methods=frozenset({'GET'}),
              respect_retry_after_header=True,
          )
          session = requests.Session()
          session.mount('https://', HTTPAdapter(max_retries=retry))

          base = f'https://graph.instagram.com/{api_version}/{ig_user_id}'
          response = session.get(
              base,
              params={'fields': 'id,username', 'access_token': token},
              timeout=30,
          )
          response.raise_for_status()
          profile = response.json()
          if not profile.get('id'):
              raise SystemExit('Instagram API returned no account identifier.')

          media = session.get(
              f'{base}/media',
              params={'fields': 'id', 'limit': 1, 'access_token': token},
              timeout=30,
          )
          media.raise_for_status()
          print(f"Instagram token validated for {profile.get('username', 'configured account')}.")
          PY

      - name: Explain block skip
        if: github.event_name != 'push' && steps.should_post.outputs.publish != 'true'
        run: echo "No unposted round block closed yesterday; Instagram publishing was skipped."

      - name: Render round block cards
        if: steps.should_post.outputs.publish == 'true'
        run: python scripts/instagram_schedule.py render

      - name: Commit round block cards
        id: card_commit
        if: steps.should_post.outputs.publish == 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add assets/instagram/blocks/
          if ! git diff --cached --quiet; then
            git commit -m "chore(instagram): render closed round blocks"
            git pull --rebase origin main
            git push origin main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish to Instagram
        id: publish
        if: steps.should_post.outputs.publish == 'true' && env.INSTAGRAM_ACCESS_TOKEN != ''
        continue-on-error: true
        env:
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.card_commit.outputs.sha }}/assets/instagram/blocks
        run: |
          # A resposta bruta da API pode conter detalhes sensíveis. Ela fica apenas no runner efêmero.
          python scripts/instagram_schedule.py publish --image-base-url "$IMAGE_BASE_URL" > /tmp/instagram-publish.log 2>&1

      - name: Explain missing token
        if: steps.should_post.outputs.publish == 'true' && env.INSTAGRAM_ACCESS_TOKEN == ''
        run: echo "INSTAGRAM_ACCESS_TOKEN is not configured; card generation succeeded but publishing was skipped."

      - name: Record sanitized publish status
        if: always() && steps.should_post.outputs.publish == 'true'
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          outcome = os.environ.get('PUBLISH_OUTCOME', 'skipped')
          payload = {
              'timestamp_utc': datetime.now(timezone.utc).isoformat(),
              'outcome': outcome,
          }
          if outcome == 'failure':
              payload['detail'] = 'Falha de publicação; resposta bruta da API suprimida por segurança.'
          path = Path('data/instagram_publish_status.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/instagram_publish_status.json
          if [ -f data/instagram_blocks_published.json ]; then
            git add data/instagram_blocks_published.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(instagram): record sanitized publish status"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Fail if Instagram publish failed
        if: steps.publish.outcome == 'failure'
        run: exit 1

