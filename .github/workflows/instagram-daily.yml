name: Publish Daily Instagram Summary

on:
  schedule:
    # 10:00 em São Paulo (UTC-3). O job só publica se houve jogo concluído no dia anterior.
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  INSTAGRAM_IG_USER_ID: '17841429981371844'
  INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
  INSTAGRAM_API_VERSION: 'v23.0'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pillow requests

      - name: Test Instagram automation
        run: python -m unittest tests/test_instagram_daily.py tests/test_instagram_clusters.py tests/test_instagram_engagement.py tests/test_instagram_matchday.py

      - name: Check if yesterday had completed matches
        id: should_post
        run: |
          if python - <<'PY'
          import json
          import re
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          matches = json.loads(Path('data/serie_a_2026.json').read_text(encoding='utf-8'))['matches']
          target = (datetime.now(ZoneInfo('America/Sao_Paulo')).date() - timedelta(days=1)).strftime('%d/%m/%Y')
          completed = [
              match for match in matches
              if match.get('date') == target
              and re.fullmatch(r'\d+\s*x\s*\d+', (match.get('score') or '').strip())
          ]
          print(f'{len(completed)} jogo(s) concluído(s) em {target}.')
          raise SystemExit(0 if completed else 1)
          PY
          then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain no-match skip
        if: steps.should_post.outputs.publish != 'true'
        run: echo "No completed Serie A matches yesterday; Instagram publishing was skipped."

      - name: Render daily card
        if: steps.should_post.outputs.publish == 'true'
        run: python scripts/instagram_matchday.py render

      - name: Commit daily card
        id: card_commit
        if: steps.should_post.outputs.publish == 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add assets/instagram/daily.png
          if ! git diff --cached --quiet; then
            git commit -m "chore(instagram): refresh daily card"
            git pull --rebase origin main
            git push origin main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish to Instagram
        id: publish
        if: steps.should_post.outputs.publish == 'true' && env.INSTAGRAM_ACCESS_TOKEN != ''
        continue-on-error: true
        env:
          IMAGE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.card_commit.outputs.sha }}/assets/instagram/daily.png
        run: |
          # A resposta bruta da API pode conter detalhes sensíveis. Ela fica apenas no runner efêmero.
          python scripts/instagram_engagement.py --image-url "$IMAGE_URL" > /tmp/instagram-publish.log 2>&1

      - name: Explain missing token
        if: steps.should_post.outputs.publish == 'true' && env.INSTAGRAM_ACCESS_TOKEN == ''
        run: echo "INSTAGRAM_ACCESS_TOKEN is not configured; card generation succeeded but publishing was skipped."

      - name: Record sanitized publish status
        if: always() && steps.should_post.outputs.publish == 'true'
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          outcome = os.environ.get('PUBLISH_OUTCOME', 'skipped')
          payload = {
              'timestamp_utc': datetime.now(timezone.utc).isoformat(),
              'outcome': outcome,
          }
          if outcome == 'failure':
              payload['detail'] = 'Falha de publicação; resposta bruta da API suprimida por segurança.'
          path = Path('data/instagram_publish_status.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/instagram_publish_status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(instagram): record sanitized publish status"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Fail if Instagram publish failed
        if: steps.publish.outcome == 'failure'
        run: exit 1
