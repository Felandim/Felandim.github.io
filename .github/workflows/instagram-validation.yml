name: Validate Instagram Editorial Change

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pillow requests
      - name: Compile Instagram scripts
        run: python -m py_compile scripts/instagram_daily.py scripts/instagram_matchday.py scripts/instagram_engagement.py
      - name: Run Instagram tests
        run: python -m unittest tests/test_instagram_daily.py tests/test_instagram_clusters.py tests/test_instagram_engagement.py tests/test_instagram_matchday.py tests/test_instagram_momentum.py tests/test_instagram_leapfrog.py
