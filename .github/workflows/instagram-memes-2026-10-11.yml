name: Publish approved memes carousel - 2026-10-11

on:
  push:
    branches: [main]
    paths:
      - assets/instagram/memes-2026-10-11/publish.json

permissions:
  contents: read

concurrency:
  group: instagram-memes-2026-10-11
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Felandim/Felandim.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install publishing dependencies
        run: pip install pillow
      - name: Validate the three approved cards
        run: python assets/instagram/memes-2026-10-11/publish.py
      - name: Publish one carousel and verify the result
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python assets/instagram/memes-2026-10-11/publish.py --publish
