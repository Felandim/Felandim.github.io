name: Update Libertadores 2026 Data

on:
  pull_request:
    paths:
      - 'libertadores_2026/**'
      - 'libertadores.js'
      - 'style.css'
      - '.github/workflows/libertadores-2026-update.yml'
  push:
    branches:
      - main
    paths:
      - 'libertadores_2026/**'
      - 'libertadores.js'
      - 'style.css'
      - '.github/workflows/libertadores-2026-update.yml'
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: libertadores-2026-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Atualizar página da Libertadores
        run: python3 libertadores_2026/main.py
      - name: Validar dados gerados
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('data/libertadores_2026.json').read_text(encoding='utf-8'))
          assert len(data['groups']) == 8
          assert sum(len(group['games']) for group in data['groups']) == 96
          assert len(data['matches']) == 155
          assert data['scorers']
          print('8 grupos, 155 partidas e artilharia validados.')
          PY
      - name: Commitar atualização
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet data/libertadores_2026.json libertadores/index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/libertadores_2026.json libertadores/index.html
          git commit -m "Update Libertadores 2026 data"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
