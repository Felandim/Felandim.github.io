name: Validate Instagram Editorial Update

on:
  push:
    branches: [main]
    paths:
      - 'scripts/instagram_daily.py'
      - 'tests/test_instagram_daily.py'
      - '.github/workflows/instagram-validation-temp.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pillow requests
      - name: Run Instagram tests
        run: python -m unittest tests/test_instagram_daily.py
