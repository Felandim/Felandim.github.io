name: Security validation

on:
  push:
    paths:
      - 'brasileirao.js'
      - 'site.js'
      - 'data/instagram_publish_status.json'
      - '.github/workflows/**'
      - 'tests/test_security_hardening.py'
  pull_request:
    paths:
      - 'brasileirao.js'
      - 'site.js'
      - 'data/instagram_publish_status.json'
      - '.github/workflows/**'
      - 'tests/test_security_hardening.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node --check brasileirao.js
      - run: node --check site.js
      - run: python3 -m unittest tests/test_security_hardening.py
