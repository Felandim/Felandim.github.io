name: Security validation

on:
  push:
    paths:
      - 'brasileirao.js'
      - 'site.js'
      - 'data/instagram_publish_status.json'
      - '.github/workflows/**'
      - 'tests/test_security_hardening.py'
  pull_request:
    paths:
      - 'brasileirao.js'
      - 'site.js'
      - 'data/instagram_publish_status.json'
      - '.github/workflows/**'
      - 'tests/test_security_hardening.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --check brasileirao.js
      - run: node --check site.js
      - run: python3 -m unittest tests/test_security_hardening.py
