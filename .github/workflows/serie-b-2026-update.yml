name: Update Serie B 2026 Data

on:
  pull_request:
    paths:
      - 'serie_b_2026/**'
      - '.github/workflows/serie-b-2026-update.yml'
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser diagnostic
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect ge round navigation
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          url = "https://ge.globo.com/futebol/brasileirao-serie-b/"
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(locale="pt-BR")
              seen = []

              def record(response):
                  lower = response.url.lower()
                  if any(token in lower for token in ("rodada", "tabela", "classificacao", "fase", "jogo")):
                      seen.append((response.status, response.url))

              page.on("response", record)
              page.goto(url, wait_until="networkidle", timeout=120_000)
              page.wait_for_selector(".tabela-navegacao", timeout=60_000)

              nav = page.locator(".tabela-navegacao")
              print("NAV_TEXT", nav.inner_text())
              print("NAV_HTML", nav.evaluate("element => element.outerHTML"))
              games = page.locator(".placar-jogo")
              print("GAME_COUNT", games.count())
              if games.count():
                  print("FIRST_GAME_HTML", games.first.evaluate("element => element.outerHTML"))

              selector = page.locator(".tabela-navegacao-seletor")
              before = selector.inner_text()
              previous = page.locator(".tabela-navegacao-anterior")
              print("PREVIOUS_COUNT", previous.count())
              previous.click()
              page.wait_for_function(
                  "([selector, before]) => document.querySelector(selector)?.innerText !== before",
                  arg=[".tabela-navegacao-seletor", before],
                  timeout=60_000,
              )
              page.wait_for_timeout(2_000)
              print("ROUND_BEFORE", before)
              print("ROUND_AFTER", selector.inner_text())
              print("AFTER_GAME_COUNT", games.count())
              if games.count():
                  print("AFTER_FIRST_GAME_HTML", games.first.evaluate("element => element.outerHTML"))

              print("NETWORK_URLS")
              for status, response_url in sorted(set(seen)):
                  print(status, response_url)
              browser.close()
          PY
      - name: Run updater
        run: python3 serie_b_2026/main.py
      - name: Commit changes
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet data/serie_b_2026.json docs/serie_b_2026/index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/serie_b_2026.json docs/serie_b_2026/index.html
          git commit -m "Update Serie B 2026 data"
          git push
