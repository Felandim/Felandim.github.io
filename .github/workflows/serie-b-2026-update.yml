name: Update Serie B 2026 Data

on:
  pull_request:
    paths:
      - 'serie_b_2026/**'
      - '.github/workflows/serie-b-2026-update.yml'
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install beautifulsoup4 lxml
      - name: Diagnose ge markup
        run: |
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          from bs4 import BeautifulSoup
          import re

          url = "https://ge.globo.com/futebol/brasileirao-serie-b/"
          req = Request(url, headers={"User-Agent": "Mozilla/5.0", "Accept-Language": "pt-BR"})
          page = urlopen(req, timeout=45).read().decode("utf-8", errors="replace")
          soup = BeautifulSoup(page, "lxml")
          print("PAGE_LENGTH", len(page))
          print("SCRIPT_META", [(s.get("id"), s.get("type"), len(s.get_text())) for s in soup.find_all("script")[:30]])
          classes = sorted({c for tag in soup.find_all(True) for c in (tag.get("class") or []) if any(k in c.lower() for k in ("jogo", "placar", "equipe", "rodada"))})
          print("RELEVANT_CLASSES", classes[:200])
          for needle in ("mandante", "visitante", "placar_oficial", "lista-jogos", "rodada"):
              print("COUNT", needle, page.lower().count(needle))
              match = re.search(needle, page, re.I)
              if match:
                  start = max(0, match.start() - 250)
                  end = min(len(page), match.start() + 750)
                  print("SNIPPET", needle, page[start:end].replace("\n", " "))
          PY
      - name: Run updater
        run: python3 serie_b_2026/main.py
      - name: Commit changes
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet data/serie_b_2026.json docs/serie_b_2026/index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/serie_b_2026.json docs/serie_b_2026/index.html
          git commit -m "Update Serie B 2026 data"
          git push
