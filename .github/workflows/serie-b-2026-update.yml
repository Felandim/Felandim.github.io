name: Update Serie B 2026 Data

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas lxml
      - name: Run updater
        run: python3 serie_b_2026/main.py
      - name: Commit changes
        run: |
          if git diff --quiet data/serie_b_2026.json docs/serie_b_2026/index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/serie_b_2026.json docs/serie_b_2026/index.html
          git commit -m "Update Serie B 2026 data"
          git push
